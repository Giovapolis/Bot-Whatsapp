<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotWhatsApp — Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f6f3; color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    .login-wrapper {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f8f6f3 0%, #f0ece7 100%);
      padding: 24px;
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 48px 40px 40px;
      width: 100%; max-width: 400px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.04), 0 16px 40px rgba(0,0,0,0.06);
      text-align: center;
    }
    .login-icon {
      width: 56px; height: 56px; background: #25d366; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 28px;
    }
    .login-title { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
    .login-subtitle { font-size: 14px; color: #8a8a8a; margin-top: 4px; margin-bottom: 28px; }
    .login-error {
      background: #fef2f2; color: #dc2626; font-size: 13px; font-weight: 500;
      padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none;
    }
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: #4a4a4a; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 10px 14px; font-size: 15px;
      border: 1px solid #e2e0dc; border-radius: 8px; background: #fff;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus {
      border-color: #25d366; box-shadow: 0 0 0 3px rgba(37,211,102,0.12);
    }
    .btn-login {
      width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
      background: #25d366; color: #fff; border: none; border-radius: 8px;
      cursor: pointer; transition: background 0.15s, transform 0.1s; margin-top: 4px;
    }
    .btn-login:hover { background: #1da851; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.5; cursor: default; transform: none; }

    .app-header {
      background: #075e54; color: #fff; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .app-header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; }
    .app-status { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #e53935; transition: background 0.3s; }
    .status-dot.online { background: #43a047; }
    .badge {
      background: rgba(255,255,255,0.18); padding: 2px 10px; border-radius: 10px;
      font-size: 13px; font-weight: 500;
    }
    .container { max-width: 840px; margin: 0 auto; padding: 24px 16px; }
    .qr-section { text-align: center; padding: 60px 20px; }
    .qr-section img { width: 260px; height: 260px; border-radius: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06); }
    .qr-section p { margin-top: 16px; color: #7a7a7a; font-size: 14px; line-height: 1.5; }
    .qr-section strong { color: #1a1a1a; font-weight: 500; }
    .empty-state { text-align: center; padding: 80px 20px; }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { color: #8a8a8a; font-size: 15px; }
    .empty-state .sub { color: #b0b0b0; font-size: 13px; margin-top: 4px; }
    .order-card {
      background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 10px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.04);
      display: flex; align-items: flex-start; gap: 16px; transition: opacity 0.2s;
    }
    .order-card.removing { opacity: 0; }
    .order-info { flex: 1; min-width: 0; }
    .order-header { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .order-name { font-weight: 600; font-size: 15px; }
    .order-phone { color: #9a9a9a; font-size: 12px; }
    .order-message {
      margin-top: 8px; background: #f4f2ef; padding: 10px 14px; border-radius: 8px;
      font-size: 14px; line-height: 1.5; white-space: pre-wrap; color: #2a2a2a;
    }
    .order-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .order-time { font-size: 12px; color: #b0b0b0; }
    .btn-attend {
      background: #25d366; color: #fff; border: none; padding: 8px 18px;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-attend:hover { background: #1da851; }
    .btn-attend:active { transform: scale(0.97); }
    .hidden { display: none !important; }
    .conn-success { color: #43a047; }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrapper">
    <div class="login-card">
      <div class="login-icon">🍽️</div>
      <div class="login-title">BotWhatsApp</div>
      <div class="login-subtitle">Accede al panel de pedidos</div>
      <div class="login-error" id="loginError">Credenciales inválidas</div>
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="user">Usuario</label>
          <input type="text" id="user" name="user" placeholder="admin" required autofocus>
        </div>
        <div class="form-group">
          <label for="pass">Contraseña</label>
          <input type="password" id="pass" name="pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Ingresar</button>
      </form>
    </div>
  </div>

  <div id="dashboardView" class="hidden">
    <div class="app-header">
      <h1>🍽️ Pedidos</h1>
      <div class="app-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Desconectado</span>
        <span class="badge" id="orderCount">0</span>
        <button onclick="salir()" style="background:none;border:none;color:rgba(255,255,255,0.6);cursor:pointer;font-size:13px;padding:4px 8px;margin-left:4px;">Salir</button>
      </div>
    </div>
    <div class="container">
      <div class="qr-section" id="qrSection">
        <div id="qrImage"></div>
        <p><strong>Escanea el código QR</strong> con WhatsApp para vincular el bot</p>
      </div>
      <div id="ordersList"></div>
      <div class="empty-state hidden" id="emptyOrders">
        <div class="icon">📦</div>
        <p>No hay pedidos nuevos</p>
        <div class="sub">Los pedidos aparecerán aquí en tiempo real</div>
      </div>
    </div>
  </div>

  <script>
    let token = sessionStorage.getItem('token')
    let socket = null
    let pedidos = []

    async function init() {
      if (!token) { mostrarLogin(); return }

      try {
        const res = await fetch('/api/check-auth', { headers: { 'Authorization': 'Bearer ' + token } })
        if (!res.ok) { sessionStorage.removeItem('token'); mostrarLogin(); return }
      } catch {
        sessionStorage.removeItem('token'); mostrarLogin(); return
      }

      mostrarDashboard()
      conectarSocket()
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('loginBtn')
      const err = document.getElementById('loginError')
      btn.disabled = true; btn.textContent = 'Ingresando...'
      err.style.display = 'none'

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: document.getElementById('user').value, pass: document.getElementById('pass').value })
        })
        const data = await res.json()
        if (!res.ok) { err.textContent = data.error || 'Credenciales inválidas'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Ingresar'; return }
        token = data.token
        sessionStorage.setItem('token', token)
        mostrarDashboard()
        conectarSocket()
      } catch {
        err.textContent = 'Error de conexión'; err.style.display = 'block'
        btn.disabled = false; btn.textContent = 'Ingresar'
      }
    })

    function mostrarLogin() {
      document.getElementById('loginView').classList.remove('hidden')
      document.getElementById('dashboardView').classList.add('hidden')
      document.getElementById('user').focus()
      if (socket) { socket.disconnect(); socket = null }
    }

    function mostrarDashboard() {
      document.getElementById('loginView').classList.add('hidden')
      document.getElementById('dashboardView').classList.remove('hidden')
    }

    function salir() {
      sessionStorage.removeItem('token')
      if (socket) { socket.disconnect(); socket = null }
      mostrarLogin()
    }

    function conectarSocket() {
      if (socket) socket.disconnect()
      socket = io({ auth: { token } })

      socket.on('connect_error', () => {
        document.getElementById('statusDot').className = 'status-dot'
        document.getElementById('statusText').textContent = 'Error de conexión'
      })

      socket.on('qr', ({ qrDataUri }) => {
        document.getElementById('qrSection').classList.remove('hidden')
        document.getElementById('qrImage').innerHTML = `<img src="${qrDataUri}" alt="QR WhatsApp">`
        setStatus(false)
      })

      socket.on('conn_ready', () => {
        document.getElementById('qrSection').classList.add('hidden')
        document.getElementById('qrImage').innerHTML = ''
        setStatus(true)
      })

      socket.on('conn_error', () => {
        document.getElementById('qrSection').classList.remove('hidden')
        setStatus(false)
      })

      socket.on('nuevo_pedido', (pedido) => {
        pedidos.unshift(pedido)
        renderizar()
      })
    }

    function atender(id) {
      pedidos = pedidos.filter(p => p.id !== id)
      renderizar()
    }

    function renderizar() {
      document.getElementById('orderCount').textContent = pedidos.length
      const list = document.getElementById('ordersList')
      const empty = document.getElementById('emptyOrders')

      if (pedidos.length === 0) {
        list.innerHTML = ''
        empty.classList.remove('hidden')
        return
      }

      empty.classList.add('hidden')
      list.innerHTML = pedidos.map(p => `
        <div class="order-card">
          <div class="order-info">
            <div class="order-header">
              <span class="order-name">${e(p.nombre)}</span>
              <span class="order-phone">${e(p.telefono)}</span>
            </div>
            <div class="order-message">${e(p.mensaje)}</div>
            <div class="order-footer">
              <span class="order-time">${p.hora}</span>
              <button class="btn-attend" onclick="atender('${p.id}')">✓ Atendido</button>
            </div>
          </div>
        </div>
      `).join('')
    }

    function setStatus(online) {
      document.getElementById('statusDot').className = 'status-dot' + (online ? ' online' : '')
      document.getElementById('statusText').textContent = online ? 'Conectado' : 'Desconectado'
    }

    function e(str) {
      const d = document.createElement('div')
      d.textContent = str
      return d.innerHTML
    }

    init()
  </script>
</body>
</html>
