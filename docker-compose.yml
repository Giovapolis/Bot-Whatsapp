services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://bot:${DB_PASSWORD}@db:5432/bot
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASS: ${DASHBOARD_PASS}
      CLEANUP_DAYS: "30"
      AI_PROVIDER: ${AI_PROVIDER}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODELS: ${AI_MODELS:-openrouter/free}
      GEMINI_PROJECT: ${GEMINI_PROJECT:-}
      GEMINI_REGION: ${GEMINI_REGION:-us-central1}
      GEMINI_SA_FILE: ${GEMINI_SA_FILE:-/app/secrets/gemini-sa.json}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-flash-latest,gemini-2.5-flash}
    volumes:
      - auth_data:/app/auth
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  auth_data:
